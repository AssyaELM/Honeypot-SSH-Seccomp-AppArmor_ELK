input {
  file {
    path => "/var/log/honeypot/ssh_honeypot.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    codec => "json"
    type => "honeypot"
  }
}

filter {
  # Parser les logs JSON
  if [type] == "honeypot" {
    
    # Convertir le timestamp
    date {
      match => [ "timestamp", "ISO8601" ]
      target => "@timestamp"
    }
    
    # Enrichissement GeoIP
    if [source_ip] {
      geoip {
        source => "source_ip"
        target => "geoip"
        database => "/usr/share/logstash/vendor/bundle/jruby/3.1.0/gems/logstash-filter-geoip-7.2.13-java/vendor/GeoLite2-City.mmdb"
      }
      
      # Ajouter des coordonnées pour la carte
      if [geoip][location] {
        mutate {
          add_field => {
            "[geoip][coordinates]" => "%{[geoip][location][lon]}"
          }
        }
        mutate {
          add_field => {
            "[geoip][coordinates]" => "%{[geoip][location][lat]}"
          }
        }
        mutate {
          convert => {
            "[geoip][coordinates]" => "float"
          }
        }
      }
    }
    
    # Classifier les événements
    if [event_type] == "ssh_login_attempt" {
      mutate {
        add_tag => ["login_attempt"]
      }
    }
    
    if [event_type] == "ssh_command" {
      mutate {
        add_tag => ["command_executed"]
      }
    }
    
    if [alert_type] == "brute_force_detected" {
      mutate {
        add_tag => ["brute_force", "alert"]
        add_field => {
          "severity" => "high"
        }
      }
    }
    
    # Détecter les utilisateurs communs
    if [username] in ["root", "admin", "Administrator", "user", "test"] {
      mutate {
        add_tag => ["common_username"]
      }
    }
    
    # Détecter les mots de passe communs
    if [password] in ["123456", "password", "admin", "root", "12345678"] {
      mutate {
        add_tag => ["weak_password"]
      }
    }
  }
}

output {
  # Sortie vers Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "honeypot-ssh-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }
  
  # Sortie vers la console pour debugging
  stdout {
    codec => rubydebug
  }
}
